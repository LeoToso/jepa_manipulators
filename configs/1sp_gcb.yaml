# 1SP+GCB: one-step prediction + goal-conditioned bisimulation (reward-free), for symmetry with 1)-2)
inherit: base.yaml
model:
  use_gcb: true
training:
  prediction: one_step
  lambda_gcb_phi: 1.0
  lambda_gcb_psi: 1.0
  lambda_gcb_reward: 1.0
  gcb_gamma: 0.99
  gcb_reward: state_distance     # -(EE position / rotation / gripper distance of s' to g);
                                 # 'indicator' = paper's 1[s'=g] (degenerate here, see losses.py),
                                 # 'latent_distance' = -|zbar' - zbar_g| (self-supervised)
  gcb_state_scales: [0.05, 0.5, 2.0]   # metres, radians, gripper range
  gcb_reward_scale: 1.0
  gcb_distance: normalized   # per-dimension norms; 'paper' = raw sums (shrinks the latent, see losses.py)
